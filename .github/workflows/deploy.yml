name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd /root/opt/griverworld/app
            git pull origin main
            # data 下的 *.db 是 app 容器(nextjs uid 1001)的 SQLite 数据库，需保证可写；
            # 注意：只处理直接子文件，勿用 -R 递归——umami-postgres/ 属 postgres(uid 70)，递归 chown 会导致其无法读取数据而崩溃
            mkdir -p data
            find data -maxdepth 1 -type f -exec chown 1001:1001 {} +
            docker compose up -d --build
