name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd /root/opt/griverworld/app
            git pull origin main
            # 评论数据库目录：容器内以 nextjs 用户(uid 1001)运行，需保证 data 目录可写
            mkdir -p data
            chown -R 1001:1001 data
            docker compose up -d --build
