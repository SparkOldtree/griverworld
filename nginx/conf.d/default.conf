# ============================================
# HTTP → HTTPS 重定向
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name griver.world www.griver.world;

    # Let's Encrypt ACME 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS 主站配置
# ============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name griver.world www.griver.world;

    # SSL 证书
    ssl_certificate     /etc/letsencrypt/live/www.griver.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.griver.world/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ============================================
    # 动态上游解析（防单点放大故障）
    # ============================================
    # 使用 Docker 内置 DNS 在请求时解析，每 10s 刷新缓存：
    # 1. 后端容器（app/umami）未启动时 nginx 仍可正常启动，不再全站宕机
    # 2. 后端容器重启换 IP 后自动跟随，无需重启 nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app:3000;
    set $umami_upstream umami:3000;

    # ============================================
    # Gzip 压缩
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # 上传限制 20MB
    client_max_body_size 20M;

    # ============================================
    # Next.js 静态资源 —— 长缓存
    # ============================================
    location /_next/static/ {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 静态资源文件名含 hash，可永久缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # Umami 访问统计 —— 反向代理（basic auth 保护）
    # ============================================
    # Umami API 请求（JS 携带 Bearer token 鉴权，basic auth 会覆盖冲突，由 Umami 自身鉴权）
    location /analytics/api/ {
        proxy_pass http://$umami_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Umami 埋点脚本（公网必须可访问，不受 basic auth 保护）
    location = /analytics/script.js {
        proxy_pass http://$umami_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /analytics {
        auth_basic "Griver Analytics";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # 原样转发，Umami 以 BASE_PATH=/analytics 构建，路由与资源均带 /analytics 前缀
        proxy_pass http://$umami_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # ============================================
    # 其他请求 —— 反向代理到 Next.js
    # ============================================
    location / {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;

        # WebSocket 支持（AI 流式响应等）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 标准代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关闭代理缓冲（流式响应需要）
        proxy_buffering off;

        # 超时设置
        proxy_read_timeout 120s;
    }
}
