services:
  # ============================================
  # Next.js 应用服务（仅内网可访问）
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* 变量必须在构建阶段内联进客户端 JS bundle，
      # 仅通过 env_file 在运行时注入无效（评论功能依赖此配置）
      args:
        NEXT_PUBLIC_GISCUS_REPO: ${NEXT_PUBLIC_GISCUS_REPO:-}
        NEXT_PUBLIC_GISCUS_REPO_ID: ${NEXT_PUBLIC_GISCUS_REPO_ID:-}
        NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${NEXT_PUBLIC_GISCUS_CATEGORY_ID:-}
    container_name: griverworld-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      # SQLite 数据库持久化
      - ./data:/app/data
      # 文章 Markdown 文件持久化
      - ./content/articles:/app/content/articles
      # 视频 Markdown 文件持久化
      - ./content/videos:/app/content/videos
      # 资讯 Markdown 文件持久化
      - ./content/news:/app/content/news
      # 上传文件持久化
      - ./public/uploads:/app/public/uploads
    networks:
      - site-network

  # ============================================
  # Nginx 反向代理
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: griverworld-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 配置（只读）
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书（Let's Encrypt，只读）
      # 挂载整个 /etc/letsencrypt 目录：live 下的证书是符号链接，指向 archive 目录，
      # 分开挂载会导致容器内符号链接断裂（nginx 报 fullchain.pem not found）
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - site-network

# ============================================
# 网络
# ============================================
networks:
  site-network:
    driver: bridge
