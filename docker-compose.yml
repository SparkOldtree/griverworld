services:
  # ============================================
  # Next.js 应用服务（仅内网可访问）
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: griverworld-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      # SQLite 数据库持久化
      - ./data:/app/data
      # 文章 Markdown 文件持久化
      - ./content/articles:/app/content/articles
      # 视频 Markdown 文件持久化
      - ./content/videos:/app/content/videos
      # 上传文件持久化
      - ./public/uploads:/app/public/uploads
    networks:
      - site-network

  # ============================================
  # Nginx 反向代理
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: griverworld-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 配置（只读）
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书（Let's Encrypt，只读）
      - /etc/letsencrypt/live/griver.world:/etc/letsencrypt/live/griver.world:ro
      - /etc/letsencrypt/archive/griver.world:/etc/letsencrypt/archive/griver.world:ro
    depends_on:
      - app
    networks:
      - site-network

# ============================================
# 网络
# ============================================
networks:
  site-network:
    driver: bridge
