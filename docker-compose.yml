services:
  # ============================================
  # Next.js 应用服务（仅内网可访问）
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建期注入，Next.js 在 layout.tsx 中静态求值（运行时 env_file 不参与静态渲染）
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
    container_name: griverworld-app
    restart: unless-stopped
    mem_limit: 768m
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      # SQLite 数据库持久化
      - ./data:/app/data
      # 采集脚本与源码（保持宿主机最新，更新后无需重建镜像）
      - ./scripts:/app/scripts
      - ./src:/app/src
      # 文章 Markdown 文件持久化
      - ./content/articles:/app/content/articles
      # 视频 Markdown 文件持久化
      - ./content/videos:/app/content/videos
      # 资讯 Markdown 文件持久化
      - ./content/news:/app/content/news
      # 上传文件持久化
      - ./public/uploads:/app/public/uploads
    networks:
      - site-network

  # ============================================
  # Nginx 反向代理
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: griverworld-nginx
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 配置（只读）
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # basic auth 密码文件（只读）
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      # SSL 证书（Let's Encrypt，只读）
      # 挂载整个 /etc/letsencrypt 目录：live 下的证书是符号链接，指向 archive 目录，
      # 分开挂载会导致容器内符号链接断裂（nginx 报 fullchain.pem not found）
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - site-network

  # ============================================
  # Umami 访问统计 —— PostgreSQL 数据库
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: griverworld-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    # 调低 PG 内存占用，避免峰值打满服务器
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    volumes:
      - ./data/umami-postgres:/var/lib/postgresql/data
    networks:
      - site-network

  # ============================================
  # Umami 访问统计 —— 应用（面板 + 埋点 + 统计 API）
  # ============================================
  # 说明：镜像 griverworld-umami:3.3.1 需自定义构建（BASE_PATH 是构建期变量，运行时无效）：
  #   git clone --depth 1 --branch v3.3.1 https://github.com/umami-software/umami.git umami-src
  #   cd umami-src && docker build --build-arg BASE_PATH=/analytics -t griverworld-umami:3.3.1 .
  umami:
    image: griverworld-umami:3.3.1
    container_name: griverworld-umami
    restart: unless-stopped
    mem_limit: 384m
    environment:
      DATABASE_URL: postgresql://umami:umami@postgres:5432/umami
      DISABLE_TELEMETRY: 1
    depends_on:
      - postgres
    networks:
      - site-network

# ============================================
# 网络
# ============================================
networks:
  site-network:
    driver: bridge
